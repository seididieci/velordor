[package]
name = "cardo"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
civis = { path = "../../libs/civis" }
blake2s = { path = "../../blake2s" }
arcafs = { path = "../../arcafs" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
# 56.2b/c: LTO per il margine sotto SPAWN_IMAGE_MAX (motore B+tree + GC in
# cardo). Solo cardo (profilo del crate top-level): altri binari intoccati.
# thin in 56.2b, fat in 56.2c (misurato: il margine per GC+meta non basta).
lto = "fat"
